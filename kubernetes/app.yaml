apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-platform
  namespace: task-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-platform
  template:
    metadata:
      labels:
        app: task-platform
    spec:
      containers:
        - name: task-platform
          image: localhost:5000/task-platform:2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: task-platform-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: task-platform-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-platform-secret
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: task-platform
  namespace: task-platform
spec:
  type: ClusterIP
  selector:
    app: task-platform
  ports:
    - port: 8000
      targetPort: 8000