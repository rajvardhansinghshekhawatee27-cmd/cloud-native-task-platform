apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-platform
  namespace: task-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-platform
  template:
    metadata:
      labels:
        app: task-platform
    spec:
      containers:
        - name: task-platform
          image: localhost:5000/task-platform:2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://taskuser:taskpassword@postgres:5432/taskdb
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: task-platform
  namespace: task-platform
spec:
  type: ClusterIP
  selector:
    app: task-platform
  ports:
    - port: 8000
      targetPort: 8000